    <!-- CONTACT Section -->
    <section id="Contact" class="cd-section">
        <div class="vertical-align">

            <div class="info-box info-box-fixed info-box-white markdown-body xscrollable-container" style="width:690px; border:none; border-right: 1px solid #ededed !important; box-shadow: none;">
                    <iframe id="iframe-resume" src="./cv/resume-turcanu-razvan.html" class="full-screen-iframe"></iframe>
            </div>

            <div class="container">
 
                    <div class="card-container col-lg-4 col-lg-offset-4 col-md-4 col-md-offset-4 col-xs-6 ">
                        <img class="img-responsive bussiness-card" data-src="img/preload/bussiness-card.jpg" alt="">
                    </div>
 
            </div>
        </div>

        <!-- // decrease font size in cv -->
        <script>
            function applyIframeStyles() {
                const iframe = document.getElementById("iframe-resume");
                if (!iframe) return;
                
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const style = doc.createElement("style");
                style.textContent = ".markdown-body { font-size:14px !important;}";
                doc.head.appendChild(style);
            }
            
            function waitForIframeAndApply() {
                const iframe = document.getElementById("iframe-resume");
                
                if (!iframe) {
                    // iframe doesn't exist yet, retry
                    requestAnimationFrame(waitForIframeAndApply);
                    return;
                }
                
                // iframe exists, wait for it to load
                iframe.addEventListener("load", applyIframeStyles);
            }
            
            // Wait until DOM is ready
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", waitForIframeAndApply);
            } else {
                waitForIframeAndApply();
            }
        </script>

    </section>
