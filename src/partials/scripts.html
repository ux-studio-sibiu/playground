        (function ($) {
            // Bind the function to global jQuery object.
            $.fn.reveal = function () {
                // Arguments is a variable which is available within all functions
                // and returns an object which holds the arguments passed.
                // It is not really an array, so by calling Array.prototype
                // he is actually casting it into an array.
                var args = Array.prototype.slice.call(arguments);

                // For each elements that matches the selector:
                return this.each(function () {
                    // this is the dom element, so encapsulate the element with jQuery.
                    var img = $(this),
                        src = img.data("src");

                    // If there is a data-src attribute, set the attribute
                    // src to make load the image and bind an onload event.
                    src && img.attr("src", src).load(function () {
                        // Call the first argument passed (like fadeIn, slideIn, default is 'show').
                        // This piece is like doing img.fadeIn(1000) but in a more dynamic way.
                        img[args[0] || "show"].apply(img, args.splice(1));
                    });
                });
            }
        }(jQuery));

            var introTiltDegrees = 12;
            var introDeadZonePx = 100;
            var introNeutralBandPx = 100;
            var introMousemoveThrottleMs = 40;
            var lastIntroTiltUpdateTs = 0;

            $(document).on("mousemove", function (event) {
                var now = Date.now();
                if ((now - lastIntroTiltUpdateTs) < introMousemoveThrottleMs) {
                    return;
                }
                lastIntroTiltUpdateTs = now;

                if (!introSeparator.length || !introSection.hasClass("visible")) {
                    introSeparator.css("transform", "rotate(0deg)");
                    return;
                }

                var separatorOffset = introSeparator.offset();
                if (!separatorOffset) {
                    return;
                }

                var separatorCenterX = separatorOffset.left + (introSeparator.outerWidth() / 2);
                var separatorCenterY = separatorOffset.top + (introSeparator.outerHeight() / 2);
                var cursorDeltaX = event.pageX - separatorCenterX;
                var cursorDeltaY = event.pageY - separatorCenterY;
                var isCursorBelowSeparator = event.pageY > separatorCenterY;

                if (Math.abs(cursorDeltaY) <= (introNeutralBandPx / 2)) {
                    introSeparator.css("transform", "rotate(0deg)");
                    return;
                }

                if (Math.abs(cursorDeltaX) <= introDeadZonePx) {
                    introSeparator.css("transform", "rotate(0deg)");
                    return;
                }

                var tiltDirection = cursorDeltaX < 0 ? -1 : 1;
                if (isCursorBelowSeparator) {
                    tiltDirection = -tiltDirection;
                }

                introSeparator.css("transform", "rotate(" + (tiltDirection * introTiltDegrees) + "deg)");
            });

            $(document).on("mouseleave", function () {
                lastIntroTiltUpdateTs = 0;
                introSeparator.css("transform", "rotate(0deg)");

        <!-- Fluid-hover effect: WebGL displacement on the cursor for the
             #Demos cover slide. Lazy-loaded — fluid-hover.js statically imports
             three (~600KB), so we defer that fetch with a dynamic import() and
             only trigger it as the Demos slide is approached. The render loop is
             paused/resumed with slide visibility so we never paint hidden frames. -->
        <script type="module">
            // ------------------------------------------------------------------
            // DEMOS cover: no image. The "experiments" headline is rasterised
            // into the WebGL overlay and smears with the same displacement field.
            var demosHost    = document.getElementById('demos-fluid');
            var demosSection = document.getElementById('Demos');
            var demosFx = null;
            var loading = false;

            function buildFluidHover() {
                if (demosFx || loading || !demosHost) return;
                loading = true;
                // Dynamic import is what actually fetches fluid-hover.js → three.
                import('./js/fluid-hover.js').then(function (mod) {
                    demosFx = mod.createFluidHover({
                        container: demosHost,
                        imageless: true,
                        strength: 0.22,
                        radius:   7,
                        chroma:   0.018,
                        customDraw: function (ctx, info) {
                            var cx = info.width / 2;
                            var cy = info.height / 2;
                            var dpr = info.dpr;

                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'alphabetic';

                            // Headline — matches .section-heading.font-160 in scale.
                            // Letter-spacing in canvas2D requires per-glyph drawing,
                            // so we fake the tight -0.7rem look by setting `letter-spacing`
                            // on the context (supported in modern Chromium/WebKit) and
                            // falling back to plain rendering elsewhere.
                            ctx.font = '500 ' + (160 * dpr) + 'px "Poppins", system-ui, sans-serif';
                            if ('letterSpacing' in ctx) ctx.letterSpacing = (-7 * dpr) + 'px';
                            ctx.fillStyle = '#000000';
                            ctx.fillText('experiments', cx, cy);

                            // Subtitle — matches .lead.section-lead.
                            ctx.font = '400 ' + (20 * dpr) + 'px "Poppins", system-ui, sans-serif';
                            if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
                            ctx.fillStyle = 'rgba(0,0,0,0.8)';
                            ctx.fillText('ai-assisted prototypes', cx, cy + 28 * dpr);
                        },
                    });

                    // The custom fonts (Poppins) may not be ready when the first
                    // overlay is drawn. Repaint once they're available.
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(function () { demosFx.redrawOverlay(); });
                    }

                    // Match the loop to live visibility. Building may finish while
                    // the user is on another slide (pre-warm) or has already
                    // arrived (in-flight nav) — re-check here rather than trust the
                    // state at call time. createFluidHover() starts running.
                    if (!demosSection || !demosSection.classList.contains('visible')) {
                        demosFx.pause();
                    }
                });
            }

            if (demosSection) {
                // Pre-warm: start fetching three.js + building the effect when the
                // slide *before* Demos becomes visible, so it's ready on arrival.
                var prevSection = demosSection.previousElementSibling;
                while (prevSection && !prevSection.classList.contains('cd-section')) {
                    prevSection = prevSection.previousElementSibling;
                }

                function syncDemosVisibility() {
                    if (demosSection.classList.contains('visible')) {
                        if (demosFx) demosFx.resume();
                        else buildFluidHover(); // build resumes/pauses per live visibility
                    } else if (demosFx) {
                        demosFx.pause();
                    }
                }

                // The section-nav plugin toggles `.visible` on the active slide.
                new MutationObserver(syncDemosVisibility)
                    .observe(demosSection, { attributes: true, attributeFilter: ['class'] });

                if (prevSection) {
                    new MutationObserver(function () {
                        if (prevSection.classList.contains('visible')) buildFluidHover();
                    }).observe(prevSection, { attributes: true, attributeFilter: ['class'] });
                }

                // Handle the case where Demos is already the landing slide.
                syncDemosVisibility();
            }
        </script>
