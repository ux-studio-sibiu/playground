    <!-- Demos - Zoom Section -->
    <section id="zoom-iframe" class="cd-section">
        <div class="">
            
            <div class="background-image" style="width:calc(100% - 400px); left:400px;">
                <div class="bg-layer bg-layer-a"></div>
                <div class="bg-layer bg-layer-b"></div>
                <div class="device-view">
                    <iframe src="https://vue-playground-mauve.vercel.app/zoom" class="full-screen-iframe" style="position:relative" tabindex="-1"></iframe>
                </div>
            </div>

            <div class="info-box info-box-fixed info-box-white markdown-body scrollable-container scroll-white" style="width: 400px;">
                <div class="scroll-container">
                    <section>
                        <p style="font-size: 2.4rem; margin:30px 0;"><strong><code>Zoom</code></strong></p>
                        <ul>
                            <li>zoom based navigation for presentation website</li>
                            <li>css-transform navigation using <code>Zoomooz.js</code></li>
                            <li>draft concept, presented here in iframe</li>
                            <li>iframe → parent page messaging</li>
                            <li>AI-assisted (github copilot), reviewed and refined</li>
                            
                        </ul>
                    </section>

                    <br>
                    <section class="stack-section">
                        <strong><code>Stack</code> : </strong>
                        <code>vue</code>
                        <code>nuxt</code>
                        <code>vercel</code>
                        <code>git</code>
                        <code>github copilot</code>
                        <code>vscode</code>
                    </section>
	            </div>
            </div>

             <script>
                (function () {
                    var zoomIframeBackground = document.querySelector("#zoom-iframe .background-image");
                    if (!zoomIframeBackground) return;
                    var layers = [
                        zoomIframeBackground.querySelector(".bg-layer-a"),
                        zoomIframeBackground.querySelector(".bg-layer-b")
                    ];
                    if (!layers[0] || !layers[1]) return;
                    var activeIndex = -1;
                    var lastPayloadClass = "";

                    function toZoomPayloadClass(value) {
                        if (!value) return "";
                        var normalized = String(value).toLowerCase().replace(/^https?:\/\//, "").replace(/\?.*$/, "").replace(/#.*$/, "").replace(/\.[a-z0-9]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
                        return normalized ? ("zoom-payload-" + normalized) : "";
                    }

                    window.addEventListener("message", function (event) {
                        if (!event || !event.data || event.data.type !== "IFRAME_EVENT") return;
                        var nextClass = toZoomPayloadClass(event.data.data || "");

                        // Empty payload → nothing zoomed: fade out whichever layer is active.
                        if (!nextClass) {
                            if (activeIndex !== -1) {
                                layers[activeIndex].classList.remove("is-visible");
                                activeIndex = -1;
                            }
                            lastPayloadClass = "";
                            return;
                        }

                        if (nextClass === lastPayloadClass) return;

                        var nextIndex = activeIndex === 0 ? 1 : 0;
                        var incoming = layers[nextIndex];
                        var outgoing = activeIndex === -1 ? null : layers[activeIndex];

                        // Strip any stale zoom-payload-* class left from a previous cycle
                        // (incoming layer may still carry a class from 2 messages ago).
                        for (var i = incoming.classList.length - 1; i >= 0; i--) {
                            var cls = incoming.classList[i];
                            if (cls.indexOf("zoom-payload-") === 0) incoming.classList.remove(cls);
                        }
                        incoming.classList.add(nextClass);
                        // force reflow so the new bg-image is committed before fading in
                        // eslint-disable-next-line no-unused-expressions
                        incoming.offsetWidth;
                        incoming.classList.add("is-visible");
                        if (outgoing) outgoing.classList.remove("is-visible");

                        activeIndex = nextIndex;
                        lastPayloadClass = nextClass;
                    });
                }());
            </script>

        </div>
    </section>
